<!doctype html>
<html lang="cs">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="robots" content="noindex, nofollow">
  <meta name="theme-color" content="#3d4250">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-title" content="Pracovní list">
  <meta name="format-detection" content="telephone=no">
  <title>Pracovní list Fleetware</title>
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" href="icons/icon.svg" type="image/svg+xml">
  <link rel="apple-touch-icon" href="icons/icon-180.png">
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <header class="topbar">
    <div class="topbar-row">
      <div class="brand" aria-label="Fleetware">fleetware</div>
      <div class="topbar-title" id="tbOrder">Pracovní list</div>
      <button type="button" class="topbar-btn" id="btnNew">Nový list</button>
    </div>
    <div class="progress" aria-live="polite">
      <div class="progress-track"><i id="progBar"></i></div>
      <span id="progText">Povinná pole 0/0</span>
    </div>
  </header>

  <main id="form" novalidate></main>

  <footer class="bottombar">
    <button type="button" class="hint" id="hint"></button>
    <button type="button" class="btn primary" id="btnSend" disabled>Odeslat</button>
  </footer>

  <div id="toast" class="toast" role="status" aria-live="polite" hidden></div>

  <noscript><p style="padding:16px">Formulář potřebuje zapnutý JavaScript.</p></noscript>

  <script src="config.js"></script>
  <script src="pdf.js"></script>
  <script src="app.js"></script>
</body>
</html>
